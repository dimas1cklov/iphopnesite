<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#E0262D">
<title>Phone Store</title>
<style>
html,body{margin:0;height:100%;background:#f6f5f4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#1c1b1a}
button,input{font:inherit}button{cursor:pointer}
#app{min-height:100dvh;display:flex;flex-direction:column}
header{background:#E0262D;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:800}
#back{width:40px;height:40px;margin-left:-8px;border:0;background:none;color:#fff;font-size:28px;display:none}
main{flex:1;width:100%;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 24px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:960px;margin:0 auto}
.card{border:2px solid #E0262D;background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:1/1;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain}
.card b{font-size:15px}
#ov{position:fixed;inset:0;background:rgba(20,18,17,.45);z-index:10;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:640px;margin:0 auto;display:none;flex-direction:column;gap:20px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.lbl{font-size:13px;font-weight:700;color:#6d6a67;text-transform:uppercase;letter-spacing:.06em}
.thumb{position:relative;width:64px;height:64px;flex:none;border-radius:12px;background:#fff;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.dot{width:44px;height:44px;border-radius:50%;padding:4px;background:#fff;border:2px solid transparent}
.dot i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot.on{border-color:#E0262D}
.pill{min-height:44px;padding:0 18px;border-radius:22px;border:2px solid #E0262D;font-weight:700;font-size:15px;background:#fff;color:#E0262D}
.pill.on{background:#E0262D;color:#fff}
.cta{min-height:54px;border:0;border-radius:14px;background:#E0262D;color:#fff;font-weight:800;font-size:16px;letter-spacing:.08em;width:100%}
.cta:disabled{background:#e6e2de;color:#9b9692}
.co{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sum{display:flex;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:12px}
.sum .thumb{width:56px;height:56px;border-radius:10px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld div{display:flex;align-items:center;justify-content:space-between}
.fld span{font-size:13px;font-weight:700;color:#6d6a67}
.paste{min-height:32px;padding:0 12px;border:0;border-radius:16px;background:#fdecec;color:#E0262D;font-weight:800;font-size:13px}
.fld input{height:52px;border-radius:12px;border:1.5px solid #E0262D;background:#fff;padding:0 14px;font-size:16px;outline:none;color:#1c1b1a;width:100%}
.done{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;max-width:none}
.done h2{margin:8px 0 0;font-size:24px;font-weight:800}.done p{margin:0;font-size:15px;color:#6d6a67;max-width:300px}
.back{margin-top:18px;min-height:50px;padding:0 28px;border-radius:14px;border:2px solid #E0262D;background:#fff;color:#E0262D;font-weight:800;font-size:15px}
.scene{position:relative;width:100vw;max-width:100%;height:120px;overflow:hidden}
.road{position:absolute;left:0;right:0;bottom:18px;height:3px;background:linear-gradient(90deg,#d9d4cf 0 22px,transparent 22px 40px);background-size:40px 3px;animation:roadMove .5s linear infinite}
.rider{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);animation:rideOff 2.8s cubic-bezier(.55,0,.75,.2) .4s forwards}
.rider>div{position:relative}.moto{font-size:72px;line-height:1;display:block;transform:scaleX(-1);animation:rideBob .35s ease-in-out infinite}
.puff{position:absolute;left:-6px;bottom:10px;width:14px;height:14px;border-radius:50%;background:#cfcac5;animation:puff .8s ease-out infinite}
@keyframes rideOff{0%{transform:translateX(-50%)}30%{transform:translateX(-50%)}38%{transform:translateX(calc(-50% - 10px))}100%{transform:translateX(calc(50vw + 120px))}}
@keyframes rideBob{0%,100%{transform:scaleX(-1) translateY(0) rotate(0)}50%{transform:scaleX(-1) translateY(-3px) rotate(-2deg)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.7}100%{opacity:0;transform:translate(-40px,-10px) scale(1.4)}}
@keyframes roadMove{to{background-position:-40px 0}}
</style></head>

const IMG=b=>'data:image/webp;base64,'+b;
const S={screen:'select',mi:0,ci:0,si:0,name:'',address:'',phone:''};
const $=s=>document.querySelector(s);
const m=()=>MODELS[S.mi], col=()=>m().colors[S.ci], st=()=>m().storage[S.si];
const summary=()=>col()[0]+' · '+st();
const okForm=()=>S.name.trim().length>1&&S.address.trim().length>4;
const thumbs=()=>m().colors.map((c,i)=>'<img alt="" src="'+IMG(c[2])+'" style="opacity:'+(i===S.ci?1:0)+'">').join('');

function go(screen){
  S.screen=screen;
  $('#title').textContent={select:'Select your Phone',checkout:'Checkout',done:'Order Placed'}[screen];
  $('#back').style.display=screen==='checkout'?'flex':'none';
  const v=$('#view');
  if(screen==='select'){
    v.className='';v.style.cssText='';
    v.innerHTML='<p style="margin:0 0 16px;font-size:14px;color:#6d6a67;max-width:960px;margin:0 auto 16px">Choose a model to configure</p><div class="grid">'+
      MODELS.map((x,i)=>'<button class="card" data-i="'+i+'"><div class="ph"><img alt="'+x.name+'" src="'+IMG(x.colors[0][2])+'"></div><b>'+x.name+'</b></button>').join('')+'</div>';
    v.querySelectorAll('.card').forEach(b=>b.onclick=()=>{S.mi=+b.dataset.i;S.ci=0;S.si=0;openSheet();});
  }else if(screen==='checkout'){
    v.className='';v.style.cssText='';
    v.innerHTML='<div class="co"><div class="sum"><div class="thumb">'+thumbs()+'</div><div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:800">'+m().name+'</div><div style="font-size:13px;color:#6d6a67">'+summary()+'</div></div></div>'+
      [['name','Your Name','John Doe','name'],['address','Shipping Address','City, Street, House','street-address'],['phone','Phone Number','+1 555 000 0000','tel']].map(f=>'<label class="fld"><div><span>'+f[1]+'</span><button type="button" class="paste">Paste</button></div><input data-k="'+f[0]+'" value="'+S[f[0]]+'" placeholder="'+f[2]+'" autocomplete="'+f[3]+'"'+(f[0]==='phone'?' type="tel"':'')+'></label>').join('')+
      '<div style="display:flex;justify-content:space-between;font-size:15px;border-top:1px solid #e6e2de;padding-top:14px"><span style="color:#6d6a67">Shipping</span><b>Included</b></div><button class="cta" id="go">CONTINUE</button></div>';
    const upd=()=>$('#go').disabled=!okForm();
    v.querySelectorAll('input').forEach(i=>i.oninput=()=>{S[i.dataset.k]=i.value;upd();});
    v.querySelectorAll('.paste').forEach(b=>b.onclick=()=>{paste();v.querySelectorAll('input').forEach(i=>i.value=S[i.dataset.k]);upd();});
    $('#go').onclick=()=>okForm()&&go('done');upd();
  }else{
    v.className='done';
    v.innerHTML='<div class="scene"><div class="road"></div><div class="rider"><div><span class="puff"></span><span class="puff" style="animation-delay:.25s"></span><span class="puff" style="animation-delay:.5s"></span><span class="moto">🛵</span></div></div></div>'+
      '<h2>Your order is on its way!</h2><p>'+m().name+' · '+summary()+' will be delivered to '+(S.address.trim()||'your address')+'.</p><button class="back" id="again">Back to Store</button>';
    $('#again').onclick=()=>{Object.assign(S,{mi:0,ci:0,si:0,name:'',address:'',phone:''});go('select');};
  }
  scrollTo(0,0);
}
function openSheet(){
  const x=m(),sh=$('#sheet');
  sh.innerHTML='<div style="width:40px;height:5px;border-radius:3px;background:#dcd8d4;align-self:center"></div>'+
   '<div style="display:flex;gap:14px;align-items:center"><div class="thumb">'+thumbs()+'</div><div><div style="font-size:18px;font-weight:800">'+x.name+'</div><div style="font-size:14px;color:#6d6a67">'+summary()+'</div></div></div>'+
   '<div style="display:flex;flex-direction:column;gap:10px"><span class="lbl">Color · '+col()[0]+'</span><div style="display:flex;gap:12px;flex-wrap:wrap">'+
   x.colors.map((c,i)=>'<button class="dot'+(i===S.ci?' on':'')+'" data-c="'+i+'" aria-label="'+c[0]+'"><i style="background:'+c[1]+'"></i></button>').join('')+'</div></div>'+
   '<div style="display:flex;flex-direction:column;gap:10px"><span class="lbl">Storage</span><div style="display:flex;gap:10px;flex-wrap:wrap">'+
   x.storage.map((t,i)=>'<button class="pill'+(i===S.si?' on':'')+'" data-s="'+i+'">'+t+'</button>').join('')+'</div></div><button class="cta" id="next">NEXT</button>';
  sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.ci=+b.dataset.c;openSheet();});
  sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.si=+b.dataset.s;openSheet();});
  $('#next').onclick=()=>{closeSheet();go('checkout');};
  sh.style.display='flex';$('#ov').style.display='block';
}
function closeSheet(){$('#sheet').style.display='none';$('#ov').style.display='none';}
function paste(){
  const r=a=>a[Math.floor(Math.random()*a.length)],n=(a,b)=>a+Math.floor(Math.random()*b);
  S.name=r(['James','Emma','Liam','Olivia','Noah','Ava','Lucas','Mia','Ethan','Sophia','Daniel','Chloe'])+' '+r(['Carter','Brooks','Hayes','Morgan','Bennett','Reed','Foster','Coleman','Parker','Ellis']);
  S.address=r(['New York','Los Angeles','Chicago','Houston','Miami','Seattle','Boston','Denver'])+', '+r(['Maple St','Oak Ave','Pine Rd','Cedar Ln','Lake View Dr','Sunset Blvd','Park Ave'])+' '+n(10,190)+', apt '+n(1,60);
  S.phone='+1 '+r(['212','310','415','305','646','713','202'])+' '+n(100,900)+' '+n(1000,9000);
}
$('#ov').onclick=closeSheet;
$('#back').onclick=()=>{go('select');openSheet();};
document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f);const d=document.documentElement,q=d.requestFullscreen||d.webkitRequestFullscreen;try{q&&!document.fullscreenElement&&q.call(d);}catch(e){}},{once:true});
go('select');
</script></body></html>
